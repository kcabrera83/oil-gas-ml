site_name: Oil & Gas ML
site_description: Crude oil property prediction including API gravity, viscosity, sulfur content and quality grading.
repo_url: https://github.com/kcabrera83/oil-gas-ml
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
